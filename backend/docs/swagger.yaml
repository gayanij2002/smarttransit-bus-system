basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  buses.Bus:
    properties:
      bus_name:
        type: string
      bus_number:
        type: string
      created_at:
        type: string
      id:
        type: string
      route_id:
        type: string
      total_seats:
        type: integer
    type: object
  buses.CreateBusRequest:
    properties:
      bus_name:
        type: string
      bus_number:
        type: string
      route_id:
        type: string
      total_seats:
        type: integer
    type: object
  routes.CreateRouteRequest:
    properties:
      distance:
        type: string
      end_location:
        type: string
      start_location:
        type: string
    type: object
  routes.Route:
    properties:
      created_at:
        type: string
      distance:
        type: string
      end_location:
        type: string
      id:
        type: string
      start_location:
        type: string
    type: object
  schedules.CreateScheduleRequest:
    properties:
      arrival_time:
        type: string
      bus_id:
        type: string
      departure_time:
        type: string
    type: object
  schedules.Schedule:
    properties:
      arrival_time:
        type: string
      bus_id:
        type: string
      created_at:
        type: string
      departure_time:
        type: string
      id:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: SmartTransit Backend APIs
  title: SmartTransit Bus API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Login and receive JWT token
      parameters:
      - description: User Login
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Auth
  /api/auth/profile:
    get:
      description: Protected profile route
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: User profile
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Create new user account
      parameters:
      - description: User Register
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Register user
      tags:
      - Auth
  /api/buses/:
    get:
      description: Retrieve all buses
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/buses.Bus'
            type: array
      summary: Get all buses
      tags:
      - Buses
    post:
      consumes:
      - application/json
      description: Create new bus
      parameters:
      - description: Create Bus
        in: body
        name: bus
        required: true
        schema:
          $ref: '#/definitions/buses.CreateBusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create bus
      tags:
      - Buses
  /api/buses/{id}:
    delete:
      description: Delete bus
      parameters:
      - description: Bus ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete bus
      tags:
      - Buses
    get:
      description: Retrieve single bus
      parameters:
      - description: Bus ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/buses.Bus'
      summary: Get bus by ID
      tags:
      - Buses
    put:
      consumes:
      - application/json
      description: Update existing bus
      parameters:
      - description: Bus ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Bus
        in: body
        name: bus
        required: true
        schema:
          $ref: '#/definitions/buses.Bus'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
